name: task_manager
description: "A Flutter Task Management Application with SQLite, Notifications, and Export Features."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0          # <-- Added here

  awesome_notifications: ^0.10.1

  csv: ^6.0.0

  pdf: ^3.10.8
  printing: ^5.13.1

  intl: ^0.20.2

  shared_preferences: ^2.2.3
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
