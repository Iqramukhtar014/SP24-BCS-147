name: gym_management
description: Professional Gym Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.4
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.10

  # State Management
  provider: ^6.1.1

  # UI & Charts
  fl_chart: ^0.66.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Utilities
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.3.3
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^16.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.7
  google_sign_in: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  iconsax: ^0.0.8

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
